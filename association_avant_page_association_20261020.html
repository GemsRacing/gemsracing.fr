<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Association GEMS Karting Access | Maintenance</title>
  <meta name="description" content="La page de l'association GEMS Karting Access est temporairement en maintenance.">

  <style>
    :root {
      --navy: #061a34;
      --navy2: #0b315d;
      --orange: #f28c28;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(135deg, rgba(6,26,52,.96), rgba(11,49,93,.96)),
        repeating-linear-gradient(
          60deg,
          rgba(255,255,255,.035) 0,
          rgba(255,255,255,.035) 1px,
          transparent 1px,
          transparent 28px
        );
    }

    .maintenance-card {
      width: min(680px, 100%);
      padding: clamp(28px, 6vw, 58px);
      text-align: center;
      background: rgba(4, 19, 41, .94);
      border: 1px solid var(--orange);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .maintenance-card h1 {
      margin: 0 0 18px;
      color: var(--orange);
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-style: italic;
      text-transform: uppercase;
    }

    .maintenance-card p {
      margin: 12px auto;
      max-width: 540px;
      line-height: 1.6;
      color: rgba(255,255,255,.88);
    }

    .maintenance-icon {
      margin-bottom: 18px;
      font-size: 3rem;
    }

    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 24px;
      border-radius: 8px;
      background: var(--orange);
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }

    .btn:hover {
      background: #ff9f3d;
    }
  </style>
</head>
<body>
  <main class="maintenance-card">
    <div class="maintenance-icon">🏁</div>
    <h1>Page en maintenance</h1>
    <p>
      La page de l'association GEMS Karting Access est actuellement en cours
      d'amélioration.
    </p>
    <p>
      Elle sera bientôt de retour avec toutes les informations sur le projet
      sportif de Gems Racing.
    </p>
    <a class="btn" href="index.html">Retour à l'accueil</a>
  </main>
</body>
</html>
