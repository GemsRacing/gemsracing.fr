<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gems Racing | Intranet</title>
  <link rel="icon" type="image/png" href="assets/images/favicon-gems.png?v=5">
  <link rel="stylesheet" href="css/intranet.css">
  <style>
    #login-overlay { position: fixed; inset: 0; background: #020b17; z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #071b35; padding: 40px; border-radius: 16px; border: 2px solid #f28c28; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .login-card h1 { color: #f28c28; margin-bottom: 25px; font-size: 24px; }
    .login-card input { width: 100%; padding: 12px; background: #020b17; border: 1px solid #333; color: #fff; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 18px; }
    .password-field { display: flex; gap: 8px; align-items: stretch; margin-bottom: 20px; }
    .password-field input { flex: 1; margin-bottom: 0 !important; }
    .password-toggle { border: 1px solid #f28c28; background: transparent; color: #f28c28; border-radius: 8px; padding: 0 12px; cursor: pointer; font-weight: 700; }
    .password-toggle:hover { background: #f28c28; color: #071b35; }
  </style>
</head>
<body class="is-locked">
  <div id="login-overlay">
    <div class="login-card">
      <img src="assets/images/favicon-gems.png" style="width:60px; margin-bottom:15px;">
      <h1>GEMS RACING ADMINISTRATION</h1>
      <div class="password-field">
        <input type="password" id="pass-input" placeholder="Mot de passe" autocomplete="current-password">
        <button type="button" id="toggle-password" class="password-toggle">Afficher</button>
      </div>
      <button class="btn-primary" onclick="checkPass()" style="width:100%">SE CONNECTER</button>
    </div>
  </div>

  <header class="intra-header">
    <div class="intra-logo">GEMS <span>RACING INTRANET</span></div>
<button
    type="button"
    id="mobile-menu-toggle"
    class="mobile-menu-toggle"
    aria-label="Ouvrir le menu"
    aria-expanded="false">
    ☰
</button><a href="https://gemsracing.fr/"
   class="btn-secondary"
   style="margin-left:20px; text-decoration:none; font-size:12px; padding:10px 14px; border:1px solid #f28c28; color:#f28c28; border-radius:6px;"
   target="_blank"
   rel="noopener noreferrer">
   🌐 OUVRIR LE SITE
</a>
    <button class="btn-primary" onclick="saveAllData()">💾 ENREGISTRER & PUBLIER</button>
    <button type="button" class="btn-secondary" onclick="logoutIntranet()" style="margin-left:10px;">🔒 SE DÉCONNECTER</button>
  </header>

  <div class="intra-container">
    <nav class="intra-sidebar">
      <div class="intra-nav-item active" onclick="showTab('scoring', this)">📊 Scoring</div>
      <div class="intra-nav-item" onclick="showTab('news', this)">📰 Actus</div>
      <div class="intra-nav-item" onclick="showTab('gallery', this)">🖼️ Galerie</div>
      <div class="intra-nav-item" onclick="showTab('races', this)">📅 Agenda Courses</div>
      <div class="intra-nav-item" onclick="showTab('partners', this)">🤝 Partenaires</div>
      <div class="intra-nav-item" onclick="showTab('tickets', this)">🎫 Messages <span id="intra-badge-tickets" class="intra-nav-badge" style="display:none; background:#f28c28; color:#071b35; font-size:11px; font-weight:800; padding:2px 8px; border-radius:12px; margin-left:6px;">0</span></div>
      <div class="intra-nav-item" onclick="showTab('info', this)">ℹ️ Infos & Support</div>
    </nav>

    <main class="intra-content">
      <section id="tab-scoring" class="tab-content">
        <div class="intra-card">
          <h2>📊 Statistiques Actuelles</h2>
          <div class="intra-grid-4">
            <div class="intra-field"><label>Victoires</label><input type="text" id="stat-victoires"></div>
            <div class="intra-field"><label>Podiums</label><input type="text" id="stat-podiums"></div>
            <div class="intra-field"><label>SWS France</label><input type="text" id="stat-sws"></div>
            <div class="intra-field"><label>Âge</label><input type="text" id="stat-age"></div>
          </div>
        </div>
      </section>

      <section id="tab-news" class="tab-content" hidden>
        <div class="intra-card">
          <h2>📰 Ajouter une Actualité</h2>
          <div class="intra-field"><label>Titre</label><input type="text" id="news-title"></div>
          <div class="intra-field"><label>Résumé</label><textarea id="news-summary" rows="3"></textarea></div>
          <div class="intra-grid-2">
            <div class="intra-field"><label>Lien (Insta/Site)</label><input type="text" id="news-link"></div>
            <div class="intra-field"><label>Texte Bouton</label><input type="text" id="news-button" value="VOIR LE DÉBRIEF"></div>
          </div>
          <button class="btn-primary" onclick="addNews()">➕ PUBLIER L'ACTUALITÉ</button>
          <hr style="margin:25px 0; opacity:0.1;">
          <div id="news-list-admin"></div>
        </div>
      </section>

      <section id="tab-gallery" class="tab-content" hidden>
        <div class="intra-card">
          <h2>🖼️ Galerie Photos</h2>
          <div class="import-box">
             <input type="file" id="gallery-file" accept="imagedocument.addEventListener("DOMContentLoaded", function () {
    const toggle = document.getElementById("mobile-menu-toggle");
    const sidebar = document.querySelector(".intra-sidebar");

    if (!toggle || !sidebar) {
        console.warn("Menu hamburger introuvable.");
        return;
    }

    toggle.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();

        const opened = sidebar.classList.toggle("is-open");

        document.body.classList.toggle("mobile-menu-open", opened);
        toggle.setAttribute("aria-expanded", String(opened));
        toggle.setAttribute(
            "aria-label",
            opened ? "Fermer le menu" : "Ouvrir le menu"
        );
        toggle.textContent = opened ? "✕" : "☰";
    });

    sidebar.querySelectorAll(".intra-nav-item").forEach(function (item) {
        item.addEventListener("click", function () {
            sidebar.classList.remove("is-open");
            document.body.classList.remove("mobile-menu-open");
            toggle.setAttribute("aria-expanded", "false");
            toggle.setAttribute("aria-label", "Ouvrir le menu");
            toggle.textContent = "☰";
        });
    });
});
</script>
</body>
</html>
